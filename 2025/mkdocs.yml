  - macros:     # needs to be the last plugin to export the final osib-YAML file for all languages
      module_name: '../osib/osib_macro'
      include_dir: '../osib/include'
      verbose: false
      on_error_fail: true
extra:
  alternate:
    - name: en - English
      link: ./en/
      lang: en
    - name: cs - Česky
      link: ./cs/
      lang: cs  material_alternate  
    - name: es - Español
      link: ./es/
      lang: es
#    - name: de - Deutsch
#      link: ./de/
#      lang: de
    - name: it - Italiano
      link: ./it/
      lang: it
    - name: ja - 日本語 (Japanese)
      link: ./ja/
      lang: ja
    - name: fa - فارسی (Persian/Fārsi)
      link: ./fa/
      lang: fa
    - name: zh-Hant - 简体中文
      link: ./zh-Hant/
      lang: zh-Hant
    - name: pt-BR - (Português Brasil)
      link: ./pt-BR/
      lang: pt-BR
  osib:
    document:     osib.owasp.top10
    version:      2025-0-1
    categories:   [document, awareness]
    default_lang: en
    yaml_file:    ../osib/include/osib.yml
    export_dir:   ../osib/export
    latest:       2
    debug:        0
    cre:          osib.owasp.cre.1-0
    successor_texts:
      en:         successor
      de:         Nachfolger
    split_to_texts:
      en:         split to
      de:         Aufgeteilt in
